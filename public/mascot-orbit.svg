<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bodyGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#0B57D0"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0B57D0" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer glow ring (orbit) -->
  <ellipse cx="100" cy="105" rx="70" ry="20" fill="none" stroke="#FF6B00" stroke-width="2.5" opacity="0.6" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="0 100 105" to="360 100 105" dur="8s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Orbit dot -->
  <circle cx="170" cy="105" r="5" fill="#FF6B00" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="0 100 105" to="360 100 105" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Body (main circle) -->
  <circle cx="100" cy="95" r="52" fill="url(#bodyGrad)" filter="url(#shadow)"/>

  <!-- Face highlight -->
  <ellipse cx="100" cy="80" rx="35" ry="25" fill="white" opacity="0.12"/>

  <!-- Eyes -->
  <ellipse cx="82" cy="88" rx="11" ry="12" fill="white"/>
  <ellipse cx="118" cy="88" rx="11" ry="12" fill="white"/>

  <!-- Pupils -->
  <circle cx="84" cy="89" r="6" fill="#1E293B"/>
  <circle cx="120" cy="89" r="6" fill="#1E293B"/>

  <!-- Eye sparkle -->
  <circle cx="87" cy="86" r="2.5" fill="white"/>
  <circle cx="123" cy="86" r="2.5" fill="white"/>

  <!-- Smile -->
  <path d="M 82 108 Q 100 122 118 108" fill="none" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>

  <!-- Antenna stem -->
  <line x1="100" y1="43" x2="100" y2="25" stroke="#0B57D0" stroke-width="3" stroke-linecap="round"/>

  <!-- Antenna orb -->
  <circle cx="100" cy="22" r="7" fill="#FF6B00" filter="url(#glow)">
    <animate attributeName="r" values="7;9;7" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="22" r="3" fill="#FB923C" opacity="0.8"/>

  <!-- Magic sparkles -->
  <g filter="url(#glow)">
    <path d="M 155 55 L 158 48 L 161 55 L 168 58 L 161 61 L 158 68 L 155 61 L 148 58 Z" fill="#FF6B00" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 42 65 L 44 60 L 46 65 L 51 67 L 46 69 L 44 74 L 42 69 L 37 67 Z" fill="#3B82F6" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 145 130 L 147 126 L 149 130 L 153 132 L 149 134 L 147 138 L 145 134 L 141 132 Z" fill="#FF6B00" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Wand (bottom right) -->
  <g transform="translate(140, 120) rotate(35)">
    <rect x="-2" y="0" width="4" height="28" rx="2" fill="#64748B"/>
    <circle cx="0" cy="-3" r="5" fill="#FF6B00" filter="url(#glow)">
      <animate attributeName="r" values="5;6;5" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="-3" r="2.5" fill="#FCD34D"/>
  </g>
</svg>
